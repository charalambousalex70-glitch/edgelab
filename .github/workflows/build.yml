name: Update forecasts

on:
  schedule:
    - cron: "0 6 * * *"      # every morning (09:00 Cyprus): new results and fresh odds
    - cron: "0 17 * * *"     # every evening (20:00 Cyprus): fresh odds; Friday/Tuesday football-data odds
  workflow_dispatch:          # "Run workflow" button for a manual update
  push:                       # rebuild whenever the code or settings change
    branches: [main]
    paths-ignore: ["history/**", "README.md"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python build.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Save the prediction history
        run: |
          git config user.name "edgelab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          git diff --cached --quiet || (git commit -m "Log predictions and value bets" && git push)
      - name: Alert on new value bets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f data/alert.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "EdgeLab: $(cat data/alert_title.txt)" --body-file data/alert.md
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
